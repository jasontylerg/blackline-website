<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackline Risk</title>
<style>
    body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
        color: #1c1c1c;
    }
    header {
        background-color: #111;
        padding: 20px 40px;
        display: flex;
        align-items: center;
    }
    header img {
        height: 50px;
        margin-right: 20px;
    }
    header h1 {
        font-size: 24px;
        color: #fff;
        margin: 0;
    }
    nav {
        margin-left: auto;
    }
    nav a {
        color: #fff;
        text-decoration: none;
        margin-left: 20px;
        font-weight: bold;
    }
    nav a:hover {
        text-decoration: underline;
    }
    .hero {
        padding: 60px 40px;
        background-color: #222;
        color: #fff;
        text-align: center;
    }
    .hero h2 {
        margin: 0 0 20px 0;
        font-size: 36px;
    }
    .hero p {
        font-size: 18px;
        max-width: 800px;
        margin: 0 auto;
    }
    .heatmap-section {
        padding: 60px 40px;
        text-align: center;
        background-color: #fff;
    }
    .heatmap-section h3 {
        font-size: 28px;
        margin-bottom: 40px;
    }
    canvas {
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    footer {
        background-color: #111;
        color: #ccc;
        text-align: center;
        padding: 20px 0;
        margin-top: 40px;
    }
</style>
</head>
<body>

<header>
    <img src="A_logo_for_&quot;Blackline_Risk&quot;_is_presented_on_a_tran.png" alt="Blackline Risk Logo">
    <h1>Blackline Risk</h1>
    <nav>
        <a href="#heatmap">Heatmap</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero">
    <h2>Executive Risk Insights</h2>
    <p>Providing actionable intelligence for enterprise decision-makers. Visualize, monitor, and respond to emerging risks with clarity and precision.</p>
</section>

<section class="heatmap-section" id="heatmap">
    <h3>Executive Risk Heatmap</h3>
    <canvas id="executiveHeatmap" width="900" height="400"></canvas>
</section>

<footer id="contact">
    &copy; 2025 Blackline Risk. All rights reserved.
</footer>

<script>
const canvas = document.getElementById('executiveHeatmap');
const ctx = canvas.getContext('2d');

const width = canvas.width;
const height = canvas.height;
const cols = 12;
const rows = 8;
const cellWidth = width / cols;
const cellHeight = height / rows;

// Example risk data (0–100)
const riskData = [
    [20,35,50,60,40,70,85,90,60,50,40,30],
    [10,25,30,45,60,50,70,80,60,55,35,20],
    [0,15,25,40,55,65,75,85,70,60,45,30],
    [5,20,35,50,65,75,80,90,75,65,50,40],
    [10,30,45,60,70,80,85,95,80,70,55,40],
    [15,25,40,55,65,75,85,90,70,60,50,35],
    [5,15,25,35,50,65,70,80,65,55,40,25],
    [0,10,20,30,45,60,75,85,70,60,40,20]
];

function getColor(value){
    if(value < 50) return `rgb(${Math.floor(value*5)},200,${Math.floor(255-value*2.5)})`;
    else return `rgb(200,${Math.floor(255-value)},0)`;
}

// Animate heatmap with subtle fade
let alpha = 0;
function drawHeatmap(){
    ctx.clearRect(0,0,width,height);
    for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
            let color = getColor(riskData[r][c]);
            ctx.fillStyle = color;
            ctx.fillRect(c*cellWidth, r*cellHeight, cellWidth, cellHeight);
        }
    }

    // Grid lines
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1;
    for(let c=0;c<=cols;c++){
        ctx.beginPath();
        ctx.moveTo(c*cellWidth,0);
        ctx.lineTo(c*cellWidth,height);
        ctx.stroke();
    }
    for(let r=0;r<=rows;r++){
        ctx.beginPath();
        ctx.moveTo(0,r*cellHeight);
        ctx.lineTo(width,r*cellHeight);
        ctx.stroke();
    }

    // Axis labels
    ctx.fillStyle = "#1c1c1c";
    ctx.font = "14px Helvetica, Arial, sans-serif";
    const colLabels = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const rowLabels = ["Category 1","Category 2","Category 3","Category 4","Category 5","Category 6","Category 7","Category 8"];
    for(let c=0;c<cols;c++){
        ctx.fillText(colLabels[c], c*cellWidth + cellWidth/2 - 10, height + 20);
    }
    for(let r=0;r<rows;r++){
        ctx.fillText(rowLabels[r], -80, r*cellHeight + cellHeight/2 + 5);
    }
}

drawHeatmap();
</script>

</body>
</html>
